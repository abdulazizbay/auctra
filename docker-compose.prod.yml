services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: .
    image: auctra-server
    container_name: auctra-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '127.0.0.1:3009:3009'
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis

  batch:
    build: .
    image: auctra-server
    container_name: auctra-batch
    command: node dist/apps/auctra-batch/main
    restart: unless-stopped
    env_file: .env.production
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - api

  next:
    build:
      context: ../auctra-next
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_API_GRAPHQL_URL: ${REACT_APP_API_GRAPHQL_URL}
        REACT_APP_API_WS: ${REACT_APP_API_WS}
        REACT_APP_SITE_URL: ${REACT_APP_SITE_URL}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID}
        REACT_APP_KAKAO_REST_KEY: ${REACT_APP_KAKAO_REST_KEY}
    image: auctra-next
    container_name: auctra-next
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api

volumes:
  redis-data:
